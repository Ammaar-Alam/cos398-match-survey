name: Create Couple

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Couple code"
        required: true
      a_first:
        description: "Partner A first name"
        required: true
      a_last:
        description: "Partner A last name"
        required: true
      b_first:
        description: "Partner B first name"
        required: true
      b_last:
        description: "Partner B last name"
        required: true
      a_netid:
        description: "Partner A NetID (optional)"
        required: false
      b_netid:
        description: "Partner B NetID (optional)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create couple and participants (psql)
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error title=Missing secret::Set repository secret DATABASE_URL to your pooled DSN (port 6543)" >&2
            exit 1
          fi
          A_ID=$(uuidgen)
          B_ID=$(uuidgen)
          C_ID=$(uuidgen)
          CODE='${{ github.event.inputs.code }}'
          A_NAME="${{ github.event.inputs.a_first }} ${{ github.event.inputs.a_last }}"
          B_NAME="${{ github.event.inputs.b_first }} ${{ github.event.inputs.b_last }}"
          A_NET='${{ github.event.inputs.a_netid }}'
          B_NET='${{ github.event.inputs.b_netid }}'
          psql "$DB_URL" \
            -v code="$CODE" \
            -v cid="$C_ID" \
            -v aid="$A_ID" \
            -v bid="$B_ID" \
            -v aname="$A_NAME" \
            -v bname="$B_NAME" \
            -v anet="$A_NET" \
            -v bnet="$B_NET" <<'SQL'
          BEGIN;
          INSERT INTO couples (id, code, created_at)
          VALUES (:'cid'::uuid, :'code', NOW())
          ON CONFLICT (code) DO NOTHING;

          -- fetch couple id into psql variable :cid_found
          SELECT id AS cid_found FROM couples WHERE code = :'code' LIMIT 1;
          \gset

          INSERT INTO participants (id, couple_id, full_name, net_id, started_at)
          VALUES (:'aid'::uuid, :'cid_found'::uuid, trim(:'aname'), NULLIF(:'anet',''), NOW())
          ON CONFLICT (couple_id, full_name) DO NOTHING;

          INSERT INTO participants (id, couple_id, full_name, net_id, started_at)
          VALUES (:'bid'::uuid, :'cid_found'::uuid, trim(:'bname'), NULLIF(:'bnet',''), NOW())
          ON CONFLICT (couple_id, full_name) DO NOTHING;

          COMMIT;
          SQL
          echo "Created/ensured couple=$CODE A=$A_ID B=$B_ID"
