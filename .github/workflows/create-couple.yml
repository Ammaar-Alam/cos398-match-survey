name: Create Couple

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Couple code"
        required: true
      a_first:
        description: "Partner A first name"
        required: true
      a_last:
        description: "Partner A last name"
        required: true
      b_first:
        description: "Partner B first name"
        required: true
      b_last:
        description: "Partner B last name"
        required: true
      a_netid:
        description: "Partner A NetID (optional)"
        required: false
      b_netid:
        description: "Partner B NetID (optional)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create couple and participants (psql)
        env:
          DB_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error title=Missing secret::Set repository secret DATABASE_URL (or SUPABASE_DB_URL) to your pooled DSN" >&2
            exit 1
          fi
          A_ID=$(uuidgen)
          B_ID=$(uuidgen)
          C_ID=$(uuidgen)
          CODE='${{ github.event.inputs.code }}'
          A_NAME="${{ github.event.inputs.a_first }} ${{ github.event.inputs.a_last }}"
          B_NAME="${{ github.event.inputs.b_first }} ${{ github.event.inputs.b_last }}"
          A_NET='${{ github.event.inputs.a_netid }}'
          B_NET='${{ github.event.inputs.b_netid }}'
          psql "$DB_URL" <<SQL
          BEGIN;
          INSERT INTO couples (id, code, created_at)
          VALUES ('$C_ID', '$CODE', NOW())
          ON CONFLICT (code) DO NOTHING;
          -- Resolve couple id
          DO $$
          DECLARE cid uuid;
          BEGIN
            SELECT id INTO cid FROM couples WHERE code='$CODE' LIMIT 1;
            IF cid IS NULL THEN RAISE EXCEPTION 'Couple not found after insert'; END IF;
            INSERT INTO participants (id, couple_id, full_name, net_id, started_at)
            VALUES ('$A_ID', cid, trim('$A_NAME'), NULLIF('$A_NET',''), NOW())
            ON CONFLICT (couple_id, full_name) DO NOTHING;
            INSERT INTO participants (id, couple_id, full_name, net_id, started_at)
            VALUES ('$B_ID', cid, trim('$B_NAME'), NULLIF('$B_NET',''), NOW())
            ON CONFLICT (couple_id, full_name) DO NOTHING;
          END$$;
          COMMIT;
          SQL
          echo "Created/ensured couple=$CODE A=$A_ID B=$B_ID"
